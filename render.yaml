services:
  # 1. Backend Web Service
  - type: web
    name: shoping-backend
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://client-tan-rho-97.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        fromEnv: MONGODB_URI

  # 2. Frontend Static Site (Render Deployment)
  - type: static
    name: shoping-frontend
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shoping-backend
          envVarKey: RENDER_EXTERNAL_URL
